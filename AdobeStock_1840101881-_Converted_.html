.loading-indicator{display:none!important}

#evm-overlay{position:fixed;inset:0;z-index:50;pointer-events:none}
#evm-panel{position:absolute;left:0;top:0;pointer-events:auto}
.evm-slot{position:absolute;left:0;top:0;width:100%}
.evm-icon{position:absolute;left:0;top:0;display:grid;place-items:center;overflow:hidden;pointer-events:none}
.evm-icon img{width:100%;height:100%;object-fit:contain}
.evm-icon .evm-emoji{font-size:clamp(14px,2.8vh,28px);line-height:1}
.evm-name{position:absolute;left:0;top:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:800;font-size:clamp(12px,2.2vh,18px);color:#111;background:transparent;display:flex;align-items:center;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.evm-led{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border-radius:999px;background:rgba(255,43,43,.15);box-shadow:0 0 0 rgba(255,43,43,0);pointer-events:none;opacity:0}
.evm-led.on{opacity:1;background:rgba(255,43,43,.35);box-shadow:0 0 10px rgba(255,43,43,.95),0 0 22px rgba(255,43,43,.55)}
@keyframes evmBlink{0%,100%{opacity:1}50%{opacity:.15}}
.evm-led.blink{animation:evmBlink .22s linear infinite}
.evm-hit{position:absolute;left:0;top:0;appearance:none;-webkit-appearance:none;border:0;background:transparent;color:transparent;cursor:pointer}
.evm-hit:active{transform:translateY(1px)}
.evm-hit[disabled]{opacity:.45;cursor:not-allowed}
body[data-evm-debug="true"] #evm-panel{outline:2px dashed rgba(255,255,255,.35);outline-offset:2px}
body[data-evm-debug="true"] .evm-slot{outline:1px dashed rgba(255,255,255,.22);outline-offset:1px}
body[data-evm-debug="true"] .evm-hit{background:rgba(23,119,255,.18)}

#evm-toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;border-radius:999px;padding:10px 14px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:600;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s ease}
#evm-toast.show{opacity:1}

#evm-admin{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:1fr;pointer-events:none}
#evm-admin[data-open="true"]{pointer-events:auto}
#evm-admin-backdrop{grid-row:1;grid-column:1;background:rgba(0,0,0,.55);opacity:0;transition:opacity .18s ease}
#evm-admin[data-open="true"] #evm-admin-backdrop{opacity:1}
#evm-admin-sheet{grid-row:1;grid-column:1;align-self:end;background:#111;color:#fff;border-top-left-radius:18px;border-top-right-radius:18px;max-height:88vh;overflow:auto;transform:translateY(12px);opacity:0;transition:transform .18s ease,opacity .18s ease;padding-bottom:16px}
#evm-admin[data-open="true"] #evm-admin-sheet{transform:translateY(0);opacity:1}
#evm-admin-header{position:sticky;top:0;background:#111;padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:12px}
#evm-admin-title{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:900;font-size:16px}
#evm-admin-close{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:12px;padding:10px 12px;font-weight:800}
#evm-admin-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.evm-card{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;background:rgba(255,255,255,.04)}
.evm-card h3{margin:0 0 10px 0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px;font-weight:900}
.evm-field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.evm-field label{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:12px;color:rgba(255,255,255,.78);font-weight:700}
.evm-field input[type="text"],.evm-field input[type="url"]{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);color:#fff;padding:12px;font-size:14px;outline:none}
.evm-field input[type="range"]{width:100%}
.evm-row-editor{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18)}
.evm-row-editor-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.evm-mini{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:12px;color:rgba(255,255,255,.8);font-weight:700}
.evm-btn{appearance:none;-webkit-appearance:none;border:0;border-radius:12px;padding:10px 12px;font-weight:900}
.evm-btn.primary{background:#1777ff;color:#fff}
.evm-btn.danger{background:#d92c2c;color:#fff}
.evm-btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
</style>
<script>
(function(){
  var STORAGE_KEY_STATE = "evm_state_v1";
  var STORAGE_KEY_TALLY = "evm_tally_v1";

  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }
  function qs(sel, root){ return (root || document).querySelector(sel); }
  function ce(tag, attrs){
    var el = document.createElement(tag);
    if(attrs){
      Object.keys(attrs).forEach(function(k){
        if(k === "text") el.textContent = attrs[k];
        else if(k === "class") el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      });
    }
    return el;
  }

  function defaultState(){
    return {
      layout: { x: 0.06, y: 0.18, w: 0.88, h: 0.70 },
      geometry: { iconX: 0.03, iconW: 0.12, iconY: 0.14, iconH: 0.72, nameX: 0.18, nameW: 0.52, nameY: 0.18, nameH: 0.64, btnX: 0.76, btnW: 0.22, btnY: 0.12, btnH: 0.76, ledX: 0.72, ledY: 0.50, ledS: 0.18 },
      candidates: [
        { name: "Candidate 1", iconType: "emoji", iconValue: "🟦" },
        { name: "Candidate 2", iconType: "emoji", iconValue: "🟩" },
        { name: "Candidate 3", iconType: "emoji", iconValue: "🟥" },
        { name: "Candidate 4", iconType: "emoji", iconValue: "🟨" },
        { name: "Candidate 5", iconType: "emoji", iconValue: "🟪" },
        { name: "Candidate 6", iconType: "emoji", iconValue: "🟧" },
        { name: "Candidate 7", iconType: "emoji", iconValue: "⬛" },
        { name: "Candidate 8", iconType: "emoji", iconValue: "⬜" }
      ],
      locked: false,
      selected: null
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY_STATE);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.candidates || !parsed.layout) return defaultState();
      if(!parsed.geometry) parsed.geometry = defaultState().geometry;
      return parsed;
    }catch(e){
      return defaultState();
    }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(state)); }catch(e){}
  }
  function loadTally(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY_TALLY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveTally(){
    try{ localStorage.setItem(STORAGE_KEY_TALLY, JSON.stringify(tally)); }catch(e){}
  }

  var state = loadState();
  var tally = loadTally();

  var img = null;
  var panel = null;
  var toast = null;
  var admin = null;
  var adminBody = null;
  var adminClose = null;
  var adminBackdrop = null;

  function showToast(text){
    if(!toast) return;
    toast.textContent = text;
    toast.classList.add("show");
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(function(){ toast.classList.remove("show"); }, 1100);
  }

  function findBackgroundImage(){
    var images = document.getElementsByClassName("bi");
    if(images && images.length) return images[0];
    return null;
  }

  function getPanelRect(){
    if(!img) return null;
    var r = img.getBoundingClientRect();
    var l = state.layout;
    return {
      left: r.left + r.width * l.x,
      top: r.top + r.height * l.y,
      width: r.width * l.w,
      height: r.height * l.h
    };
  }

  function updatePanelPosition(){
    if(!panel) return;
    var pr = getPanelRect();
    if(!pr) return;
    panel.style.left = pr.left + "px";
    panel.style.top = pr.top + "px";
    panel.style.width = pr.width + "px";
    panel.style.height = pr.height + "px";
  }

  function renderPanel(){
    if(!panel) return;
    panel.textContent = "";
    var rows = state.candidates || [];
    var rowCount = rows.length || 0;
    var g = state.geometry || defaultState().geometry;
    if(rowCount < 1) return;
    var panelBox = panel.getBoundingClientRect();

    function setRectPercent(el, x, y, w, h){
      el.style.left = (x * 100) + "%";
      el.style.top = (y * 100) + "%";
      el.style.width = (w * 100) + "%";
      el.style.height = (h * 100) + "%";
    }

    rows.forEach(function(c, idx){
      var rowTop = idx / rowCount;
      var rowH = 1 / rowCount;

      var slot = ce("div", { class: "evm-slot" });
      slot.dataset.idx = String(idx);
      setRectPercent(slot, 0, rowTop, 1, rowH);

      var icon = ce("div", { class: "evm-icon" });
      setRectPercent(icon, g.iconX, g.iconY, g.iconW, g.iconH);
      if(c.iconType === "image" && c.iconValue){
        var im = ce("img", { alt: "" });
        im.src = c.iconValue;
        icon.appendChild(im);
      }else{
        icon.appendChild(ce("div", { class: "evm-emoji", text: c.iconValue || "🗳️" }));
      }

      var name = ce("div", { class: "evm-name", text: c.name || ("Candidate " + (idx + 1)) });
      setRectPercent(name, g.nameX, g.nameY, g.nameW, g.nameH);

      var led = ce("div", { class: "evm-led" });
      if(state.selected === idx) led.classList.add("on");
      led.style.left = (g.ledX * 100) + "%";
      led.style.top = (g.ledY * 100) + "%";
      var rowPx = Math.max(1, (panelBox.height || 1) / rowCount);
      var ledPx = Math.max(10, Math.round(rowPx * g.ledS));
      led.style.width = ledPx + "px";
      led.style.height = ledPx + "px";

      var btn = ce("button", { class: "evm-hit", type: "button", "aria-label": "Vote " + (c.name || ("Candidate " + (idx + 1))) });
      if(state.locked) btn.disabled = true;
      setRectPercent(btn, g.btnX, g.btnY, g.btnW, g.btnH);

      btn.addEventListener("click", function(){
        if(state.locked) return;
        state.selected = idx;
        state.locked = true;
        saveState();

        try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){}

        led.classList.add("on");
        led.classList.add("blink");
        window.setTimeout(function(){ led.classList.remove("blink"); }, 900);

        tally[idx] = (tally[idx] || 0) + 1;
        saveTally();
        showToast("Vote recorded");
        renderPanel();
        renderAdmin();
      });

      slot.appendChild(icon);
      slot.appendChild(name);
      slot.appendChild(led);
      slot.appendChild(btn);
      panel.appendChild(slot);
    });
  }

  function openAdmin(){
    if(!admin) return;
    admin.setAttribute("data-open", "true");
    document.body.setAttribute("data-evm-debug", "true");
    renderAdmin();
  }
  function closeAdmin(){
    if(!admin) return;
    admin.setAttribute("data-open", "false");
    document.body.removeAttribute("data-evm-debug");
  }

  function renderAdmin(){
    if(!adminBody) return;
    adminBody.textContent = "";

    var layoutCard = ce("div", { class: "evm-card" });
    layoutCard.appendChild(ce("h3", { text: "Layout" }));

    function addRange(label, key){
      var field = ce("div", { class: "evm-field" });
      field.appendChild(ce("label", { text: label }));
      var input = ce("input");
      input.type = "range";
      input.min = "0";
      input.max = "100";
      input.value = String(Math.round(state.layout[key] * 100));
      input.addEventListener("input", function(){
        state.layout[key] = clamp(parseFloat(input.value) / 100, 0, 1);
        saveState();
        updatePanelPosition();
      });
      field.appendChild(input);
      layoutCard.appendChild(field);
    }

    addRange("Left", "x");
    addRange("Top", "y");
    addRange("Width", "w");
    addRange("Height", "h");
    adminBody.appendChild(layoutCard);

    var geoCard = ce("div", { class: "evm-card" });
    geoCard.appendChild(ce("h3", { text: "Row Geometry" }));

    function addGeoRange(label, key){
      var field = ce("div", { class: "evm-field" });
      field.appendChild(ce("label", { text: label }));
      var input = ce("input");
      input.type = "range";
      input.min = "0";
      input.max = "100";
      input.value = String(Math.round((state.geometry || defaultState().geometry)[key] * 100));
      input.addEventListener("input", function(){
        if(!state.geometry) state.geometry = defaultState().geometry;
        state.geometry[key] = clamp(parseFloat(input.value) / 100, 0, 1);
        saveState();
        renderPanel();
      });
      field.appendChild(input);
      geoCard.appendChild(field);
    }

    addGeoRange("Icon X", "iconX");
    addGeoRange("Icon W", "iconW");
    addGeoRange("Icon Y", "iconY");
    addGeoRange("Icon H", "iconH");
    addGeoRange("Name X", "nameX");
    addGeoRange("Name W", "nameW");
    addGeoRange("Name Y", "nameY");
    addGeoRange("Name H", "nameH");
    addGeoRange("LED X", "ledX");
    addGeoRange("LED Y", "ledY");
    addGeoRange("LED Size", "ledS");
    addGeoRange("Button X", "btnX");
    addGeoRange("Button W", "btnW");
    addGeoRange("Button Y", "btnY");
    addGeoRange("Button H", "btnH");
    adminBody.appendChild(geoCard);

    var candidatesCard = ce("div", { class: "evm-card" });
    candidatesCard.appendChild(ce("h3", { text: "Candidates" }));

    state.candidates.forEach(function(c, idx){
      var editor = ce("div", { class: "evm-row-editor" });
      var top = ce("div", { class: "evm-row-editor-top" });
      top.appendChild(ce("div", { class: "evm-mini", text: "Row " + (idx + 1) + " • Votes: " + (tally[idx] || 0) }));
      editor.appendChild(top);

      var nameField = ce("div", { class: "evm-field" });
      nameField.appendChild(ce("label", { text: "Name" }));
      var nameInput = ce("input");
      nameInput.type = "text";
      nameInput.value = c.name || "";
      nameInput.addEventListener("input", function(){
        c.name = nameInput.value;
        saveState();
        renderPanel();
      });
      nameField.appendChild(nameInput);
      editor.appendChild(nameField);

      var emojiField = ce("div", { class: "evm-field" });
      emojiField.appendChild(ce("label", { text: "Icon (emoji)" }));
      var emojiInput = ce("input");
      emojiInput.type = "text";
      emojiInput.value = (c.iconType === "emoji" ? (c.iconValue || "") : "");
      emojiInput.addEventListener("input", function(){
        c.iconType = "emoji";
        c.iconValue = emojiInput.value;
        saveState();
        renderPanel();
      });
      emojiField.appendChild(emojiInput);
      editor.appendChild(emojiField);

      var imgField = ce("div", { class: "evm-field" });
      imgField.appendChild(ce("label", { text: "Icon (upload image)" }));
      var imgInput = ce("input");
      imgInput.type = "file";
      imgInput.accept = "image/*";
      imgInput.addEventListener("change", function(){
        var f = imgInput.files && imgInput.files[0];
        if(!f) return;
        var reader = new FileReader();
        reader.onload = function(){
          c.iconType = "image";
          c.iconValue = String(reader.result || "");
          saveState();
          renderPanel();
        };
        reader.readAsDataURL(f);
      });
      imgField.appendChild(imgInput);
      editor.appendChild(imgField);

      candidatesCard.appendChild(editor);
    });

    adminBody.appendChild(candidatesCard);

    var actionsCard = ce("div", { class: "evm-card" });
    actionsCard.appendChild(ce("h3", { text: "Actions" }));

    var unlockBtn = ce("button", { class: "evm-btn primary", type: "button", text: "Unlock Voting" });
    unlockBtn.addEventListener("click", function(){
      state.locked = false;
      state.selected = null;
      saveState();
      renderPanel();
      showToast("Unlocked");
    });
    actionsCard.appendChild(unlockBtn);

    var clearBtn = ce("button", { class: "evm-btn danger", type: "button", text: "Clear Vote Counts" });
    clearBtn.addEventListener("click", function(){
      tally = [];
      saveTally();
      renderAdmin();
      showToast("Cleared");
    });
    actionsCard.appendChild(clearBtn);

    adminBody.appendChild(actionsCard);
  }

  function initAdminOpenGesture(){
    var pressTimer = null;
    var pressStarted = false;

    function start(e){
      var x = (e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX);
      var y = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY);
      if(x > 56 || y > 56) return;
      pressStarted = true;
      pressTimer = window.setTimeout(function(){
        if(pressStarted){
          openAdmin();
          showToast("Admin opened");
        }
      }, 650);
    }
    function end(){
      pressStarted = false;
      if(pressTimer) window.clearTimeout(pressTimer);
      pressTimer = null;
    }

    window.addEventListener("touchstart", start, { passive: true });
    window.addEventListener("touchend", end, { passive: true });
    window.addEventListener("mousedown", start);
    window.addEventListener("mouseup", end);
  }

  function boot(){
    img = findBackgroundImage();
    panel = qs("#evm-panel");
    toast = qs("#evm-toast");
    admin = qs("#evm-admin");
    adminBody = qs("#evm-admin-body");
    adminClose = qs("#evm-admin-close");
    adminBackdrop = qs("#evm-admin-backdrop");

    if(!img || !panel || !toast || !admin || !adminBody || !adminClose || !adminBackdrop){
      window.setTimeout(boot, 200);
      return;
    }

    updatePanelPosition();
    renderPanel();
    renderAdmin();

    window.addEventListener("resize", function(){
      updatePanelPosition();
    });

    adminClose.addEventListener("click", closeAdmin);
    adminBackdrop.addEventListener("click", closeAdmin);
    initAdminOpenGesture();
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  }else{
    boot();
  }
})();
</script>
</head>
